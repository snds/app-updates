# The host helper's image, ghcr.io/snds/app-updates-host-helper.
#
# Every pull request builds it and checks it starts (no push). Every push to
# main also pushes it as `<version>-main.<commit time, UTC>` and `main`, with
# build provenance. GITHUB_TOKEN only; no stored secret.
name: Host helper image

on:
  push:
    branches: [main]
    paths:
      - "host-helper/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".dockerignore"
      - ".github/workflows/host-helper-image.yml"
  pull_request:
    paths:
      - "host-helper/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".dockerignore"
      - ".github/workflows/host-helper-image.yml"

permissions:
  contents: read

concurrency:
  group: host-helper-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/app-updates-host-helper
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' host-helper/Cargo.toml | head -n1)
          when=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
          echo "version=${base}-main.${when}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build -f host-helper/Dockerfile \
            --build-arg "VERSION=${{ steps.version.outputs.version }}" \
            -t "$IMAGE:${{ steps.version.outputs.version }}" .

      - name: Check it starts, refuses an empty allow-list, and has compose
        run: |
          ref="$IMAGE:${{ steps.version.outputs.version }}"
          docker run --rm "$ref" --help
          docker run --rm --entrypoint docker "$ref" compose version
          mkdir -p "$RUNNER_TEMP/cfg"
          printf 'listen = ["0.0.0.0:7480"]\nkeys_dir = "/config/keys"\n' > "$RUNNER_TEMP/cfg/allow-list.toml"
          if docker run --rm -v "$RUNNER_TEMP/cfg:/config:ro" "$ref" check --config /config/allow-list.toml; then
            echo "an allow-list with no stacks was accepted"; exit 1
          fi

      - name: Push
        if: env.PUBLISH == 'true'
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${{ steps.version.outputs.version }}"
          docker push "$IMAGE:$version"
          docker tag "$IMAGE:$version" "$IMAGE:main"
          docker push "$IMAGE:main"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE:$version\` and \`:main\` ($digest)" >> "$GITHUB_STEP_SUMMARY"

      - name: Provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
