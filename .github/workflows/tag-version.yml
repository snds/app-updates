# Tags each new version of the kit by itself, so apps can pin a tag (README: tag = "vX.Y.Z").
# Runs after CI passes on main. Reads the version from Cargo.toml; if the tag vX.Y.Z does not
# exist yet, it makes an annotated tag on the commit CI tested. An existing tag is never moved.
name: Tag version

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag the version CI passed, once
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "No version in Cargo.toml"; exit 1; }
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$SHA" -m "snds-app-updates $version"
          git push origin "$tag"
          echo "Tagged $tag at $SHA"
