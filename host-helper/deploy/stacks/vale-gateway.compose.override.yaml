# Copy to /mnt/user/appdata/vale/apps/gateway/compose.override.yaml (beside
# compose.yaml). `docker compose` reads it on its own, and so does the helper.
#
# It puts the gateway on its private network with the helper and gives it the
# helper's address and its key (host-helper.env, written by keygen, mode 600).
services:
  gateway:
    env_file:
      - .env
      - host-helper.env
    networks:
      - default
      - host-helper

networks:
  host-helper:
    name: host-helper-vale-gateway
    external: true
