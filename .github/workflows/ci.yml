name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The release scripts (release/): standard library only, every platform the workflow runs them on.
  release-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 release/test_release.py -v
        if: runner.os != 'Windows'
      - run: python release/test_release.py -v
        if: runner.os == 'Windows'

  # The rules alone: no window, every platform.
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Tauri glue, with the updater plugin's own signature check under Tauri's mock runtime.
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --features tauri,update-test,test-runtime -- -D warnings
      - run: cargo test --features tauri,update-test,test-runtime

  # The Unraid host's restart helper (host-helper/): the server and the client, and the client
  # alone (what the servers build), on Linux, where it runs.
  host-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p snds-app-updates-host-helper --all-targets -- -D warnings
      - run: cargo clippy -p snds-app-updates-host-helper --no-default-features --all-targets -- -D warnings
      - run: cargo test -p snds-app-updates-host-helper
      - run: cargo test -p snds-app-updates-host-helper --no-default-features
